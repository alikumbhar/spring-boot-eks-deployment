apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmgmt-api
  labels:
    app: taskmgmt-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskmgmt-api
  template:
    metadata:
      labels:
        app: taskmgmt-api
    spec:
      containers:
        - name: api
          image: public.ecr.aws/a1b2c3d4/taskmgmt-spring-boot:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "portfolio"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: taskmgmt-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: taskmgmt-api
