apiVersion: v1
kind: ConfigMap
metadata:
  name: application-config
data:
  application.yml: |
    spring:
      datasource:
        url: jdbc:postgresql://postgres-service:5432/portfolio
        username: ${DB_USERNAME:portfolio_app}
        password: ${DB_PASSWORD}
      jpa:
        hibernate:
          ddl-auto: validate
        open-in-view: false
      show-sql: false
    flyway:
      enabled: true
      locations: "classpath:db/migration"
    server:
      port: 8080
    management:
      endpoints:
        web:
          exposure:
            include: health,info
    info:
      app:
        name: taskmgmt-spring-boot
        version: ${PROJECT_VERSION:-0.1.0}