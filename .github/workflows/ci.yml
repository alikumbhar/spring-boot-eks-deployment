name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # needed for OIDC auth to AWS

env:
  REGISTRY: public.ecr.aws
  IMAGE_TAG: "${{ github.sha }}"
  ECS_CLUSTER: "spring-boot-eks"
  DEPLOY_ENV: "prod"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: "full"  # needed for OIDC auth
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-arm-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/${{ env.ECS_CLUSTER }}-ecs-exec-role
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: false
          registry-type: public

      - name: Build and push Docker image
        id: docker-build
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.ECS_CLUSTER }}/spring-boot-app:${{ env.IMAGE_TAG }}"
          echo "Image URI: $IMAGE_URI"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Update kubeconfig
        uses: azure/actions-setup-kubectl@v3
        with:
          version: '1.31.0'

      - name: Update kubeconfig for cluster
        run: |
          aws eks update-kubeconfig --region us-east-1 --name ${{ env.ECS_CLUSTER }}

      - name: Deploy to EKS with ArgoCD
        run: |
          kubectl apply -k .

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: "full"
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-arm-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/${{ env.ECS_CLUSTER }}-ecs-exec-role
          aws-region: us-east-1

      - name: Deploy manifests to EKS
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/taskmgmt-api -n default --timeout=120s

      - name: Verify deployment health
        run: |
          kubectl get pods -l app=taskmgmt-api
          kubectl get svc taskmgmt-api