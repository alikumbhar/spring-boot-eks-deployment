name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # needed for OIDC auth to AWS

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: public.ecr.aws
  ECR_REPOSITORY: spring-boot-app
  ECS_CLUSTER: spring-boot-eks
  KUBE_NAMESPACE: default

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: "full"
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.ECS_CLUSTER }}-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: true
          registry-type: public

      - name: Build and push Docker image
        id: docker-build
        run: |
          IMAGE_URI="${{ env.ECR_REGISTRY }}/${{ secrets.AWS_ACCOUNT_ID }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "Image URI: $IMAGE_URI"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.ECS_CLUSTER }}

      - name: Deploy manifests to EKS
        run: |
          kubectl apply -f k8s/ -n ${{ env.KUBE_NAMESPACE }}
          kubectl rollout status deployment/taskmgmt-api -n ${{ env.KUBE_NAMESPACE }} --timeout=120s

      - name: Verify deployment health
        run: |
          kubectl get pods -l app=taskmgmt-api -n ${{ env.KUBE_NAMESPACE }}
          kubectl get svc taskmgmt-api -n ${{ env.KUBE_NAMESPACE }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: "full"
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.ECS_CLUSTER }}-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.ECS_CLUSTER }}

      - name: Deploy manifests to EKS
        run: |
          kubectl apply -f k8s/ -n ${{ env.KUBE_NAMESPACE }}
          kubectl rollout status deployment/taskmgmt-api -n ${{ env.KUBE_NAMESPACE }} --timeout=120s

      - name: Verify deployment health
        run: |
          kubectl get pods -l app=taskmgmt-api -n ${{ env.KUBE_NAMESPACE }}
          kubectl get svc taskmgmt-api -n ${{ env.KUBE_NAMESPACE }}