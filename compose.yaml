services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-portfolio}
      POSTGRES_USER: ${DB_USERNAME:-portfolio_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-password-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-portfolio_app} -d ${DB_NAME:-portfolio}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  app:
    build:
      context: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-portfolio}
      DB_USERNAME: ${DB_USERNAME:-portfolio_app}
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-password-change-me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
