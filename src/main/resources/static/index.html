<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <header>
        <h1>Task Manager</h1>
    </header>

    <section class="form-section">
        <h2 id="form-title">Add New Task</h2>
        <form id="task-form">
            <input type="hidden" id="task-id">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" required maxlength="160">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" maxlength="2000" rows="3"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-primary" id="submit-btn">Add Task</button>
                <button type="button" class="btn-secondary" id="cancel-edit" style="display:none;">Cancel</button>
            </div>
        </form>
    </section>

    <section class="list-section">
        <h2>Tasks</h2>
        <div id="tasks-list" class="tasks-list">
            <p class="loading">Loading tasks...</p>
        </div>
    </section>
</div>
<script src="app.js"></script>
</body>
</html>
